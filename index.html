<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#06100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quran Majid">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>কুরআন মাজীদ</title>
<link rel="stylesheet" href="style.v3.css">
</head>
<body>
<div id="app">
  <header>
    <div class="header-row">
      <h1>القرآن الكريم</h1>
      <button class="settings-gear" onclick="toggleSettings()" title="Settings">⚙</button>
    </div>
    <p class="subtitle">কুরআন মাজীদ</p>
  </header>

  <main>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="surahSearch" placeholder="সূরা খুঁজুন (Search by name or number)..." oninput="filterSurahs()">
    </div>
    <div id="surahList"></div>
  </main>
  <div id="surahView"></div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" onclick="closeSettings()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <span>Settings</span>
        <button class="modal-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <span class="setting-item-label">Font Size</span>
          <div class="font-control-inline">
            <button id="fontDecModal" class="font-btn-modal">A−</button>
            <span id="fontSizeLabelModal" class="font-label-modal">36</span>
            <button id="fontIncModal" class="font-btn-modal">A+</button>
          </div>
        </div>
        <div class="modal-divider"></div>
        <div class="setting-item">
          <span class="setting-item-label">Range</span>
          <div class="stepper-control">
            <button class="stepper-btn" onclick="stepRange(-1)">−</button>
            <span class="stepper-value" id="rangeValue">Full Surah</span>
            <button class="stepper-btn" onclick="stepRange(1)">+</button>
          </div>
        </div>
        <div class="modal-divider"></div>
        <div class="setting-item">
          <span class="setting-item-label">Range Repeat</span>
          <div class="stepper-control">
            <button class="stepper-btn" onclick="stepRepeat(-1)">−</button>
            <span class="stepper-value" id="repeatValue">1</span>
            <button class="stepper-btn" onclick="stepRepeat(1)">+</button>
          </div>
        </div>
        <div class="modal-divider"></div>
        <div class="setting-item">
          <span class="setting-item-label">Ayah Repeat</span>
          <div class="stepper-control">
            <button class="stepper-btn" onclick="stepAyahRepeat(-1)">−</button>
            <span class="stepper-value" id="ayahRepeatValue">Once</span>
            <button class="stepper-btn" onclick="stepAyahRepeat(1)">+</button>
          </div>
        </div>
        <div class="modal-divider"></div>
        <div class="setting-item">
          <span class="setting-item-label">Speed</span>
          <div class="stepper-control">
            <button class="stepper-btn" onclick="stepSpeed(-1)">−</button>
            <span class="stepper-value" id="speedValue">1.0x</span>
            <button class="stepper-btn" onclick="stepSpeed(1)">+</button>
          </div>
        </div>
        <div class="modal-divider"></div>
        <button class="default-btn" onclick="resetDefaults()">DEFAULT</button>
      </div>
    </div>
  </div>

</div>
<script src="app.v3.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
