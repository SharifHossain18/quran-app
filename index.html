<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#001e32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quran Majid">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>কুরআন মাজীদ</title>
<link rel="stylesheet" href="style.v3.css">
</head>
<body>
<div id="app">
  <header>
    <h1>القرآن الكريم</h1>
    <p class="subtitle">কুরআন মাজীদ</p>

    <div class="font-control">
      <button id="fontDec" class="font-btn">A−</button>
      <span id="fontSizeLabel" class="font-label">36</span>
      <button id="fontInc" class="font-btn">A+</button>
    </div>
  </header>
  <main>
    <div id="surahList"></div>
  </main>
  <div id="surahView"></div>
  <div id="audioControls" class="audio-controls">
    <button class="play-btn">▶</button>
    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <span class="time">0:00</span>
    <span class="duration">0:00</span>
    <button onclick="stopAudio()" style="background:#c62828">⏹</button>
  </div>
</div>
<script src="app.v3.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
